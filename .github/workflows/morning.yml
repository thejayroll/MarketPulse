name: Morning Market Pulse Briefing

on:
  schedule:
    # 03:00 UTC is 08:30 AM IST, Monday through Friday (1-5)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pulse:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install -r requirements.txt --system

    - name: Run Morning Pipeline
      run: |
        python main.py --mode morning

    - name: Send Push Notification
      run: |
        python send_notification.py --mode morning
      env:
        FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}

    - name: Commit and push updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git commit -m "morning update: $(date)" || echo "No changes to commit"
        git pull origin main --rebase
        git push origin main
